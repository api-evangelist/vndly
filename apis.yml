name: VNDLY
description: >-
  VNDLY is a cloud-based vendor management system (VMS) for managing contingent
  workforce, external labor, statements of work (SOW), and services procurement.
  Founded in 2017 and headquartered in Mason, Ohio, VNDLY was acquired by Workday
  in 2021 and is now offered as Workday VNDLY, pairing with Workday Human Capital
  Management (HCM) for total workforce optimization. The company no longer operates
  an independent public developer portal or API surface; integration is delivered
  through the Workday platform. This profile originated as a portfolio-company lead
  (Battery Ventures, Insight Partners) surfaced into the API Evangelist network.
